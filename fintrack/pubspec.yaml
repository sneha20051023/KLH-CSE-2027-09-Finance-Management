name: fintrack
description: Personal Finance Management and Expense Tracking System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6

  # State Management
  provider: ^6.1.2

  # Charts
  fl_chart: ^0.70.2

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.4
  flutter_local_notifications: ^18.0.1
  uuid: ^4.5.1

  # UI
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  table_calendar: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
